[project]
name = "maibot-mememeow"
version = "0.1.2"
description = "让 MaiBot 在聊天回复中检索并使用 MemeMeow 表情包"
requires-python = ">=3.12"
dependencies = [
    "maibot-plugin-sdk==2.16.0",
    "httpx>=0.27,<1",
    "cachetools>=5,<8",
    "loguru>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "pillow>=11,<13"]
integration = ["maibot==1.3.15"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.local-test/pytest"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
